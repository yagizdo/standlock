name: StandLock
options:
  bundleIdPrefix: com.yagizdokumaci
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: F475N5N7V6
    # Info.plist reads these through $(MARKETING_VERSION) and
    # $(CURRENT_PROJECT_VERSION). Both are placeholders for local builds only:
    # the release workflow overrides MARKETING_VERSION from the git tag and
    # CURRENT_PROJECT_VERSION from its run number. Nothing here needs bumping
    # before a release.
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "16"

packages:
  StandLockKit:
    path: StandLockKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  StandLock:
    type: application
    platform: macOS
    sources:
      - path: StandLock
    settings:
      base:
        INFOPLIST_FILE: StandLock/Info.plist
        CODE_SIGN_ENTITLEMENTS: StandLock/StandLock.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.yagizdokumaci.standlock
        PRODUCT_NAME: StandLock
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APP_DISPLAY_NAME: StandLock Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.yagizdokumaci.standlock.debug
        Release:
          APP_DISPLAY_NAME: StandLock
    dependencies:
      - package: StandLockKit
        product: StandLockCore
      - package: StandLockKit
        product: Scheduling
      - package: StandLockKit
        product: Detection
      - package: StandLockKit
        product: Locking
      - package: StandLockKit
        product: Coordination
      - package: Sparkle
        product: Sparkle
