name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Two tags pushed close together would otherwise race in the tap and could
# leave the cask pinned to the older release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SCHEME: StandLock
  TEAM_ID: F475N5N7V6

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run StandLockKit tests
        run: swift test --package-path StandLockKit

  release:
    needs: test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Determine build number
        run: |
          set -euo pipefail
          BUILD_NUM="${{ github.run_number }}"

          # Sparkle decides whether an update is newer by comparing this
          # number, so it must never go backwards or repeat. run_number has
          # matched the shipped build since v0.2.2 (9) through v0.3.0 (16),
          # but it restarts if this workflow is renamed or recreated, which
          # would strand every existing install on the version it has. Refuse
          # to build rather than publish an update nobody can receive.
          PREV=$(curl -sL --fail --max-time 30 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
            | sed -n 's/.*<sparkle:version>\([0-9][0-9]*\)<.*/\1/p' | head -1) || PREV=""

          if [ -n "$PREV" ] && [ "$BUILD_NUM" -le "$PREV" ]; then
            echo "::error::build number ${BUILD_NUM} is not greater than the published ${PREV}. Sparkle would ignore this release. If the Release workflow was renamed or recreated, set CURRENT_PROJECT_VERSION explicitly instead of using run_number."
            exit 1
          fi
          echo "build number ${BUILD_NUM} (previously published: ${PREV:-none})"
          echo "BUILD_NUMBER=${BUILD_NUM}" >> "$GITHUB_ENV"

      # ── Signing & Notarization Setup ──

      - name: Setup keychain and import certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: scripts/setup-keychain.sh

      - name: Setup notarization credentials
        env:
          P8_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          P8_PATH="$RUNNER_TEMP/api-key.p8"
          echo "$P8_KEY" > "$P8_PATH"
          xcrun notarytool store-credentials "ci-notary" \
            --key "$P8_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID"

      # ── Build ──

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project StandLock.xcodeproj -scheme "$SCHEME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Archive
        run: |
          xcodebuild archive \
            -project StandLock.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/StandLock.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export archive
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>F475N5N7V6</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StandLock.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist"

      - name: Verify the built version matches the tag
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/export/StandLock.app/Contents/Info.plist"
          BUILT_SHORT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILT_BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          BUILT_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "$PLIST")
          echo "built ${BUILT_NAME} ${BUILT_SHORT} (${BUILT_BUILD})"
          if [ "$BUILT_SHORT" != "$VERSION" ]; then
            echo "::error::app reports ${BUILT_SHORT} but the tag is ${VERSION}"
            exit 1
          fi
          if [ "$BUILT_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::app reports build ${BUILT_BUILD} but project.yml says ${BUILD_NUMBER}"
            exit 1
          fi
          if [ -z "$BUILT_NAME" ]; then
            echo "::error::CFBundleDisplayName is empty; APP_DISPLAY_NAME did not resolve"
            exit 1
          fi

      # ── Sign ──

      - name: Fix Sparkle framework symlinks
        run: scripts/fix-sparkle-symlinks.sh

      - name: Re-sign app and frameworks
        run: scripts/resign-app.sh

      # ── Notarize & Package ──

      - name: Notarize app bundle
        run: |
          ditto -c -k --keepParent --rsrc --sequesterRsrc \
            "$RUNNER_TEMP/export/StandLock.app" "$RUNNER_TEMP/StandLock-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/StandLock-notarize.zip" \
            --keychain-profile "ci-notary" --wait
          xcrun stapler staple "$RUNNER_TEMP/export/StandLock.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create release DMG
        run: scripts/create-release-dmg.sh

      - name: Notarize and staple DMG
        run: scripts/notarize.sh

      - name: Create DMG checksum
        run: |
          shasum -a 256 "StandLock-${VERSION}.dmg" > "StandLock-${VERSION}.dmg.sha256"
          SHA256_VALUE=$(awk '{print $1}' "StandLock-${VERSION}.dmg.sha256")
          echo "SHA256=${SHA256_VALUE}" >> "$GITHUB_ENV"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/generate-appcast.sh

      # ── Release ──

      - name: Extract release notes from CHANGELOG
        run: |
          awk '/^## StandLock v'"${VERSION}"'/{found=1} found&&/^## /&&!/^## StandLock v'"${VERSION}"'/{exit} found{print}' \
            CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::warning::CHANGELOG.md has no '## StandLock v${VERSION}' section; falling back to generated notes"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            NOTES_ARGS=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" \
              "StandLock-${VERSION}.dmg" \
              "StandLock-${VERSION}.dmg.sha256" \
              appcast.xml --clobber
          else
            gh release create "v${VERSION}" \
              --title "StandLock v${VERSION}" \
              "${NOTES_ARGS[@]}" \
              "StandLock-${VERSION}.dmg" \
              "StandLock-${VERSION}.dmg.sha256" \
              appcast.xml
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/update-homebrew-cask.sh
